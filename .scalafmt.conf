version = 3.7.7
runner.dialect = scala213
preset = default
align.preset = most
maxColumn = 120
project.git = true
docstrings.style = AsteriskSpace
align.tokens."+" = [
  {code = ":=", owner = "Term.ApplyInfix"}
]
rewrite.rules = [RedundantBraces, RedundantParens]

fileOverride {
  "glob:**/src/main/scala-3/**" {
    runner.dialect = scala3
  }
}
